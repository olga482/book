<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Технологические карты</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 0;
}

button, input, select, textarea {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    gap: 20px;
}

h1 {
    color: white;
    font-size: 24px;
    font-weight: 600;
}

.btn-primary, .btn-secondary, .btn-edit, .btn-delete, .btn-voice, .btn-add-ingredient {
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-primary {
    background: white;
    color: #667eea;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.btn-secondary {
    background: #e0e0e0;
    color: #333;
}

.btn-add-ingredient {
    background: #4CAF50;
    color: white;
    padding: 10px 20px;
}

.search-bar {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
    margin-bottom: 30px;
}

.search-bar input,
.search-bar select {
    padding: 15px 20px;
    border: none;
    border-radius: 15px;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.recipes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
}

.recipe-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    transition: all 0.3s ease;
    cursor: pointer;
}

.recipe-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}

.recipe-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.recipe-card-content {
    padding: 20px;
}

.recipe-card h3 {
    margin-bottom: 10px;
    color: #1a1a1a;
    font-size: 18px;
    font-weight: 700;
}

.recipe-category {
    display: inline-block;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    margin-bottom: 12px;
    text-transform: uppercase;
    font-weight: 600;
}

.recipe-meta {
    color: #999;
    font-size: 13px;
    margin-top: 10px;
}

.recipe-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.btn-edit {
    background: #f0f0f0;
    color: #333;
}

.btn-delete {
    background: #f0f0f0;
    color: #e74c3c;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    overflow-y: auto;
    padding: 20px;
}

.modal-content {
    background-color: white;
    margin: 40px auto;
    padding: 40px;
    border-radius: 25px;
    max-width: 650px;
    position: relative;
}

.close, .close-view {
    position: absolute;
    right: 20px;
    top: 20px;
    font-size: 28px;
    cursor: pointer;
    color: #999;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f5f5f5;
}

form label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
}

form input,
form select,
form textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.3s ease;
}

form input:focus,
form select:focus,
form textarea:focus {
    outline: none;
    border-color: #667eea;
}

.ingredient-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
}

.ingredient-row input,
.ingredient-row select {
    margin: 0;
    padding: 10px;
}

.ingredient-row button {
    padding: 10px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.product-search {
    position: relative;
}

.product-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 2px solid #667eea;
    border-radius: 8px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    display: none;
}

.product-dropdown div {
    padding: 10px;
    cursor: pointer;
}

.product-dropdown div:hover {
    background: #f0f0f0;
}

.form-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 30px;
}

@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    
    header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 20px;
        text-align: center;
    }
    
    .search-bar {
        grid-template-columns: 1fr;
    }
    
    .recipes-grid {
        grid-template-columns: 1fr;
    }
    
    .modal {
        padding: 0;
    }
    
    .modal-content {
        margin: 0;
        padding: 25px;
        border-radius: 0;
        min-height: 100vh;
    }
    
    .ingredient-row {
        grid-template-columns: 1fr;
    }
    
    .form-buttons {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Технологические карты</h1>
            <button id="addBtn" class="btn-primary">Добавить рецепт</button>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск по названию...">
            <select id="categoryFilter">
                <option value="">Все категории</option>
                <option value="торты">Торты</option>
                <option value="пирожные">Пирожные</option>
                <option value="десерты">Десерты</option>
                <option value="крема">Крема</option>
                <option value="муссы">Муссы</option>
                <option value="бисквиты">Бисквиты</option>
                <option value="начинки">Начинки</option>
                <option value="глазури">Глазури</option>
                <option value="декор">Декор</option>
                <option value="другое">Другое</option>
            </select>
        </div>

        <div id="recipesList" class="recipes-grid"></div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Новый рецепт</h2>
                <form id="recipeForm">
                    <input type="hidden" id="recipeId">
                    
                    <label>Название:</label>
                    <input type="text" id="recipeName" required>

                    <label>Категория:</label>
                    <select id="recipeCategory" required>
                        <option value="торты">Торты</option>
                        <option value="пирожные">Пирожные</option>
                        <option value="десерты">Десерты</option>
                        <option value="крема">Крема</option>
                        <option value="муссы">Муссы</option>
                        <option value="бисквиты">Бисквиты</option>
                        <option value="начинки">Начинки</option>
                        <option value="глазури">Глазури</option>
                        <option value="декор">Декор</option>
                        <option value="другое">Другое</option>
                    </select>

                    <label>Фото:</label>
                    <input type="file" id="imageUpload" accept="image/*" style="padding: 10px;">
                    <div id="uploadStatus" style="margin-top: 10px; color: #667eea; font-size: 13px;"></div>
                    <input type="hidden" id="recipeImage">

                    <label>Ингредиенты:</label>
                    <div id="ingredientsList"></div>
                    <button type="button" id="addIngredientBtn" class="btn-add-ingredient" style="margin-top: 10px;">+ Добавить ингредиент</button>

                    <label>Инструкция:</label>
                    <textarea id="recipeInstructions" rows="8"></textarea>

                    <label>Время приготовления (мин):</label>
                    <input type="number" id="recipeTime">

                    <label>Размер формы (см):</label>
                    <select id="recipeFormSize">
                        <option value="">Не указан</option>
                        <option value="10">10 см (бенто)</option>
                        <option value="12">12 см (бенто)</option>
                        <option value="14">14 см (мини)</option>
                        <option value="16">16 см</option>
                        <option value="18">18 см</option>
                        <option value="20">20 см</option>
                        <option value="22">22 см</option>
                        <option value="24">24 см</option>
                        <option value="26">26 см</option>
                        <option value="28">28 см (макси)</option>
                        <option value="30">30 см (макси)</option>
                    </select>

                    <label>Количество (для пересчета):</label>
                    <input type="number" id="recipeQuantity" placeholder="Например: 20 шт">

                    <label>Выход (порций/шт):</label>
                    <input type="text" id="recipeYield">

                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Сохранить</button>
                        <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="viewModal" class="modal">
            <div class="modal-content">
                <span class="close-view">&times;</span>
                <div id="recipeView"></div>
                
                <div id="calculator" style="display:none; margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 12px;">
                    <h3 style="margin-bottom: 15px;">Пересчет рецепта</h3>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px;">Тип пересчета:</label>
                        <select id="recalcType" style="width: 100%; padding: 10px; border-radius: 8px;">
                            <option value="diameter">По диаметру формы</option>
                            <option value="quantity">По количеству (шт)</option>
                        </select>
                    </div>
                    
                    <div id="diameterRecalc">
                        <label style="display: block; margin-bottom: 5px;">Пересчитать на форму:</label>
                        <select id="targetFormSize" style="width: 100%; padding: 10px; border-radius: 8px;">
                            <option value="10">10 см (бенто)</option>
                            <option value="12">12 см (бенто)</option>
                            <option value="14">14 см (мини)</option>
                            <option value="16">16 см</option>
                            <option value="18">18 см</option>
                            <option value="20">20 см</option>
                            <option value="22">22 см</option>
                            <option value="24">24 см</option>
                            <option value="26">26 см</option>
                            <option value="28">28 см (макси)</option>
                            <option value="30">30 см (макси)</option>
                        </select>
                    </div>
                    
                    <div id="quantityRecalc" style="display: none;">
                        <label style="display: block; margin-bottom: 5px;">Новое количество (шт):</label>
                        <input type="number" id="targetQuantity" style="width: 100%; padding: 10px; border-radius: 8px;" placeholder="Например: 30">
                    </div>
                    
                    <button onclick="calculateRecipe()" class="btn-primary" style="width: 100%; margin-top: 15px;">Пересчитать</button>
                    <div id="calculatedResult" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
// Список популярных продуктов
const products = [
    'Мука пшеничная', 'Сахар', 'Яйца', 'Масло сливочное', 'Молоко', 'Сливки 33%', 'Сливки 20%',

];

const units = ['гр', 'мл', 'шт', 'ст.л.', 'ч.л.', 'щепотка', 'по вкусу'];

let recipes = JSON.parse(localStorage.getItem('recipes')) || [];
let ingredients = [];

// Безопасная инициализация Telegram Web App
const tg = (function() {
    if (window.Telegram && window.Telegram.WebApp) {

        return app;

        ready: () => {},
        expand: () => {},
        CloudStorage: null
    };
})();

const modal = document.getElementById('modal');
const viewModal = document.getElementById('viewModal');
const addBtn = document.getElementById('addBtn');
const closeBtn = document.querySelector('.close');
const closeViewBtn = document.querySelector('.close-view');
const cancelBtn = document.getElementById('cancelBtn');
const recipeForm = document.getElementById('recipeForm');
const recipesList = document.getElementById('recipesList');
const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const imageUpload = document.getElementById('imageUpload');
const addIngredientBtn = document.getElementById('addIngredientBtn');
const recalcType = document.getElementById('recalcType');

// Таблица коэффициентов
const recalcTable = {
    10: { 10: 1, 12: 1.45, 14: 2, 16: 2.55, 18: 3.25, 20: 4, 22: 4.85, 24: 5.75, 26: 6.75, 28: 7.85, 30: 9 },

    14: { 10: 0.5, 12: 0.75, 14: 1, 16: 1.3, 18: 1.65, 20: 2, 22: 2.45, 24: 2.9, 26: 3.45, 28: 4, 30: 4.6 },

    24: { 10: 0.18, 12: 0.25, 14: 0.35, 16: 0.45, 18: 0.55, 20: 0.7, 22: 0.85, 24: 1, 26: 1.2, 28: 1.35, 30: 1.55 },
    26: { 10: 0.16, 12: 0.21, 14: 0.3, 16: 0.4, 18: 0.5, 20: 0.6, 22: 0.7, 24: 0.85, 26: 1, 28: 1.2, 30: 1.35 },

};

recalcType.onchange = () => {
    if (recalcType.value === 'diameter') {
        document.getElementById('diameterRecalc').style.display = 'block';
        document.getElementById('quantityRecalc').style.display = 'none';
    } else {
        document.getElementById('diameterRecalc').style.display = 'none';
        document.getElementById('quantityRecalc').style.display = 'block';
    }
};

function renderIngredients() {
    const container = document.getElementById('ingredientsList');
    container.innerHTML = ingredients.map((ing, index) => `
        <div class="ingredient-row">
            <div class="product-search">
                <input type="text" value="${ing.product}" 
                    id="product-${index}"
                    oninput="updateIngredient(${index}, 'product', this.value); searchProduct(${index}, this.value)" 
                    onfocus="showDropdown(${index})"
                    placeholder="Начните вводить продукт...">
                <div id="dropdown-${index}" class="product-dropdown"></div>
            </div>
            <input type="number" value="${ing.amount}" 
                id="amount-${index}"
                oninput="updateIngredient(${index}, 'amount', this.value)" 
                placeholder="Кол-во" step="0.1">
            <select id="unit-${index}" onchange="updateIngredient(${index}, 'unit', this.value)">
                ${units.map(u => `<option value="${u}" ${ing.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
            </select>
            <button type="button" onclick="removeIngredient(${index})">×</button>
        </div>
    `).join('');
}

function searchProduct(index, query) {
    const dropdown = document.getElementById(`dropdown-${index}`);
    if (!query) {
        dropdown.style.display = 'none';
        return;
    }
    
    const filtered = products.filter(p => 
        p.toLowerCase().includes(query.toLowerCase())
    );
    
    if (filtered.length > 0) {
        dropdown.innerHTML = filtered.slice(0, 10).map(p => 
            `<div onclick="selectProduct(${index}, '${p}')">${p}</div>`
        ).join('');
        dropdown.style.display = 'block';
    } else {
        dropdown.style.display = 'none';
    }
}

function showDropdown(index) {
    const dropdown = document.getElementById(`dropdown-${index}`);
    dropdown.innerHTML = products.slice(0, 10).map(p => 
        `<div onclick="selectProduct(${index}, '${p}')">${p}</div>`
    ).join('');
    dropdown.style.display = 'block';
}

function selectProduct(index, product) {
    ingredients[index].product = product;
    renderIngredients();
}

function updateIngredient(index, field, value) {
    ingredients[index][field] = value;
}

function removeIngredient(index) {
    ingredients.splice(index, 1);
    renderIngredients();
}

addIngredientBtn.onclick = () => {
    ingredients.push({ product: '', amount: '', unit: 'гр' });
    renderIngredients();
    console.log('Добавлен ингредиент, всего:', ingredients.length);
};

// Закрытие dropdown при клике вне
document.addEventListener('click', (e) => {
    if (!e.target.closest('.product-search')) {
        document.querySelectorAll('.product-dropdown').forEach(d => d.style.display = 'none');
    }
});

addBtn.onclick = () => {
    document.getElementById('modalTitle').textContent = 'Новый рецепт';
    recipeForm.reset();
    document.getElementById('recipeId').value = '';
    ingredients = [{ product: '', amount: '', unit: 'гр' }];
    renderIngredients();
    modal.style.display = 'block';
};

closeBtn.onclick = () => modal.style.display = 'none';
closeViewBtn.onclick = () => viewModal.style.display = 'none';
cancelBtn.onclick = () => modal.style.display = 'none';

window.onclick = (e) => {
    if (e.target === modal) modal.style.display = 'none';
    if (e.target === viewModal) viewModal.style.display = 'none';
};

imageUpload.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const statusDiv = document.getElementById('uploadStatus');
    
    if (file.size > 20 * 1024 * 1024) {
        statusDiv.textContent = '❌ Файл слишком большой (макс 20MB)';
        statusDiv.style.color = '#e74c3c';
        return;
    }
    
    statusDiv.textContent = '⏳ Обработка фото...';
    statusDiv.style.color = '#667eea';
    
    const reader = new FileReader();
    reader.onload = (event) => {
        document.getElementById('recipeImage').value = event.target.result;
        statusDiv.textContent = '✅ Фото добавлено!';
        statusDiv.style.color = '#4CAF50';
    };
    reader.readAsDataURL(file);
};

recipeForm.onsubmit = (e) => {
    e.preventDefault();
    
    console.log('Форма отправлена');
    console.log('Ингредиенты:', ingredients);
    
    // Фильтруем пустые ингредиенты
    const validIngredients = ingredients.filter(i => i.product && i.product.trim() && i.amount);
    
    console.log('Валидные ингредиенты:', validIngredients);
    
    if (validIngredients.length === 0) {
        alert('Добавьте хотя бы один ингредиент с названием и количеством');
        return;
    }
    
    const id = document.getElementById('recipeId').value;
    const recipe = {
        id: id || Date.now().toString(),
        name: document.getElementById('recipeName').value,
        category: document.getElementById('recipeCategory').value,
        image: document.getElementById('recipeImage').value || 'https://via.placeholder.com/400x300?text=Нет+фото',
        ingredients: JSON.stringify(validIngredients),
        instructions: document.getElementById('recipeInstructions').value,
        time: document.getElementById('recipeTime').value,
        formSize: document.getElementById('recipeFormSize').value,
        quantity: document.getElementById('recipeQuantity').value,
        yield: document.getElementById('recipeYield').value,
        createdAt: id ? recipes.find(r => r.id === id).createdAt : new Date().toISOString()
    };

    console.log('Сохраняем рецепт:', recipe);

    if (id) {
        const index = recipes.findIndex(r => r.id === id);
        recipes[index] = recipe;
    } else {
        recipes.push(recipe);
    }

    saveRecipes();
    displayRecipes();
    modal.style.display = 'none';
    alert('Рецепт сохранен!');
};

function saveRecipes() {
    console.log('Сохраняем рецепты:', recipes.length);
    localStorage.setItem('recipes', JSON.stringify(recipes));
    
    // Синхронизация с Telegram Cloud Storage если доступно
    if (tg && tg.CloudStorage) {
        try {
            tg.CloudStorage.setItem('recipes', JSON.stringify(recipes), function(error) {
                if (error) {
                    console.log('Ошибка сохранения в Telegram Cloud:', error);
                } else {
                    console.log('Сохранено в Telegram Cloud');
                }
            });
        } catch (e) {
            console.log('Ошибка при работе с Telegram Cloud:', e);
        }
    }
}

// Загрузка рецептов при старте
if (tg && tg.CloudStorage) {
    try {
        tg.CloudStorage.getItem('recipes', function(error, value) {
            if (!error && value) {
                recipes = JSON.parse(value);
                console.log('Загружено из Telegram Cloud:', recipes.length);
                displayRecipes();
            } else {
                console.log('Загружаем из localStorage');
                displayRecipes();
            }
        });
    } catch (e) {
        console.log('Ошибка загрузки из Telegram Cloud:', e);
        displayRecipes();
    }
} else {
    console.log('Загружаем из localStorage');
    displayRecipes();
}

function displayRecipes() {
    const category = categoryFilter.value;
    const search = searchInput.value.toLowerCase();
    
    const filtered = recipes.filter(recipe => {
        const matchesCategory = !category || recipe.category === category;
        const matchesSearch = recipe.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        recipesList.innerHTML = `
            <div class="empty-state" style="text-align: center; padding: 80px 30px; background: white; border-radius: 20px;">
                <h2>Пока нет рецептов</h2>
                <p style="color: #999;">Добавьте свой первый рецепт</p>
            </div>
        `;
        return;
    }

    recipesList.innerHTML = filtered.map(recipe => `
        <div class="recipe-card" onclick="viewRecipe('${recipe.id}')">
            <img src="${recipe.image}" alt="${recipe.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Нет+фото'">
            <div class="recipe-card-content">
                <span class="recipe-category">${recipe.category}</span>
                <h3>${recipe.name}</h3>
                <div class="recipe-meta">
                    ${recipe.time ? `Время: ${recipe.time} мин` : ''}
                    ${recipe.formSize ? ` | Форма: ${recipe.formSize} см` : ''}
                    ${recipe.quantity ? ` | Кол-во: ${recipe.quantity} шт` : ''}
                </div>
                <div class="recipe-actions" onclick="event.stopPropagation()">
                    <button class="btn-edit" onclick="editRecipe('${recipe.id}')">Изменить</button>
                    <button class="btn-delete" onclick="deleteRecipe('${recipe.id}')">Удалить</button>
                </div>
            </div>
        </div>
    `).join('');
}

let currentRecipe = null;

function viewRecipe(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    
    currentRecipe = recipe;
    const ings = JSON.parse(recipe.ingredients);

    const ingredientsList = ings.map(i => 
        `<li>${i.product} - ${i.amount} ${i.unit}</li>`
    ).join('');

    document.getElementById('recipeView').innerHTML = `
        <img src="${recipe.image}" alt="${recipe.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Нет+фото'" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 20px; margin-bottom: 25px;">
        <h2 style="font-size: 24px; margin-bottom: 15px;">${recipe.name}</h2>
        <span class="recipe-category">${recipe.category}</span>
        <div class="recipe-meta" style="margin-top: 15px;">
            ${recipe.time ? `Время: ${recipe.time} мин` : ''}
            ${recipe.formSize ? ` | Форма: ${recipe.formSize} см` : ''}
            ${recipe.quantity ? ` | Кол-во: ${recipe.quantity} шт` : ''}
        </div>
        <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 18px;">Ингредиенты:</h3>
        <ul style="line-height: 1.8;">${ingredientsList}</ul>
        <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 18px;">Инструкция:</h3>
        <p style="white-space: pre-wrap; line-height: 1.8;">${recipe.instructions}</p>
    `;
    
    const calculator = document.getElementById('calculator');
    if (recipe.formSize || recipe.quantity) {
        calculator.style.display = 'block';
        if (recipe.formSize) {
            document.getElementById('targetFormSize').value = recipe.formSize;
        }
    } else {
        calculator.style.display = 'none';
    }
    
    viewModal.style.display = 'block';
}

function calculateRecipe() {
    if (!currentRecipe) return;
    
    const type = recalcType.value;
    let coefficient = 1;
    
    if (type === 'diameter' && currentRecipe.formSize) {
        const originalSize = parseInt(currentRecipe.formSize);
        const targetSize = parseInt(document.getElementById('targetFormSize').value);
        
        if (recalcTable[originalSize] && recalcTable[originalSize][targetSize]) {
            coefficient = recalcTable[originalSize][targetSize];
        } else {
            coefficient = Math.pow(targetSize / originalSize, 2);
        }
    } else if (type === 'quantity' && currentRecipe.quantity) {
        const originalQty = parseFloat(currentRecipe.quantity);
        const targetQty = parseFloat(document.getElementById('targetQuantity').value);
        coefficient = targetQty / originalQty;
    } else {
        alert('Не указаны данные для пересчета');
        return;
    }
    
    const ings = JSON.parse(currentRecipe.ingredients);
    const recalculated = ings.map(i => {
        const newAmount = (parseFloat(i.amount) * coefficient).toFixed(1);
        return `<li>${i.product} - ${newAmount} ${i.unit}</li>`;
    }).join('');
    
    let title = '';
    if (type === 'diameter') {
        title = `Пересчет с ${currentRecipe.formSize} см на ${document.getElementById('targetFormSize').value} см (×${coefficient.toFixed(2)})`;
    } else {
        title = `Пересчет с ${currentRecipe.quantity} шт на ${document.getElementById('targetQuantity').value} шт (×${coefficient.toFixed(2)})`;
    }
    
    document.getElementById('calculatedResult').innerHTML = `
        <div style="background: white; padding: 15px; border-radius: 8px; margin-top: 10px;">
            <h4 style="color: #4CAF50; margin-bottom: 10px;">${title}</h4>
            <ul style="list-style-position: inside;">${recalculated}</ul>
        </div>
    `;
}

function editRecipe(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    document.getElementById('modalTitle').textContent = 'Редактировать рецепт';
    document.getElementById('recipeId').value = recipe.id;
    document.getElementById('recipeName').value = recipe.name;
    document.getElementById('recipeCategory').value = recipe.category;
    document.getElementById('recipeImage').value = recipe.image;
    document.getElementById('recipeInstructions').value = recipe.instructions;
    document.getElementById('recipeTime').value = recipe.time;
    document.getElementById('recipeFormSize').value = recipe.formSize || '';
    document.getElementById('recipeQuantity').value = recipe.quantity || '';
    document.getElementById('recipeYield').value = recipe.yield;
    
    ingredients = JSON.parse(recipe.ingredients);
    renderIngredients();
    
    modal.style.display = 'block';
}

function deleteRecipe(id) {
    if (confirm('Удалить этот рецепт?')) {
        recipes = recipes.filter(r => r.id !== id);
        saveRecipes();
        displayRecipes();
    }
}

searchInput.oninput = displayRecipes;
categoryFilter.onchange = displayRecipes;

displayRecipes();
    </script>
</body>
</html>
