<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Технологические карты</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    background: #1a1a1a;
    color: #ffffff;
    min-height: 100vh;
    padding: 0;
}

button, input, select, textarea {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    padding-bottom: 80px;
}

header {
    text-align: center;
    margin-bottom: 30px;
    padding-top: 20px;
}

h1 {
    color: #ffffff;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 10px;
}

.subtitle {
    color: #999;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 30px;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    background: #2a2a2a;
    color: #999;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.3s ease;
}

.tab.active {
    background: linear-gradient(135deg, #ff9a3c 0%, #ff6b35 100%);
    color: #ffffff;
}

.search-bar {
    background: #2a2a2a;
    border-radius: 15px;
    padding: 12px 20px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-bar input {
    background: transparent;
    border: none;
    color: #ffffff;
    flex: 1;
    outline: none;
}

.search-bar input::placeholder {
    color: #666;
}

.recipes-grid {
    display: grid;
    gap: 20px;
}

.recipe-card {
    background: #2a2a2a;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
}

.recipe-card:active {
    transform: scale(0.98);
}

.recipe-image-container {
    position: relative;
    width: 100%;
    height: 200px;
    background: #1a1a1a;
    overflow: hidden;
}

.recipe-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 0;
}

.recipe-card-content {
    padding: 20px;
}

.recipe-card h3 {
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
}

.recipe-meta {
    color: #999;
    font-size: 13px;
    margin-bottom: 15px;
}

.recipe-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.btn-edit, .btn-delete {
    padding: 10px;
    border: 1px solid #444;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    background: transparent;
    color: #999;
    transition: all 0.3s ease;
}

.btn-edit:active {
    background: #ff9a3c;
    color: #1a1a1a;
    border-color: #ff9a3c;
}

.btn-delete:active {
    background: #ff4444;
    color: #ffffff;
    border-color: #ff4444;
}

.fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #ff9a3c 0%, #ff6b35 100%);
    border: none;
    border-radius: 50%;
    color: #ffffff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 154, 60, 0.4);
    transition: all 0.3s ease;
    z-index: 100;
}

.fab:active {
    transform: scale(0.9);
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: #1a1a1a;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #2a2a2a;
}

.modal-header h2 {
    font-size: 24px;
    font-weight: 700;
}

.close {
    font-size: 28px;
    color: #999;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    padding: 20px;
}

form label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-weight: 600;
    color: #ffffff;
    font-size: 14px;
}

form input,
form select,
form textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    font-size: 15px;
    background: #2a2a2a;
    color: #ffffff;
    transition: all 0.3s ease;
}

form input:focus,
form select:focus,
form textarea:focus {
    outline: none;
    border-color: #ff9a3c;
}

form textarea {
    resize: vertical;
}

.ingredient-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
    align-items: start;
}

.ingredient-row input,
.ingredient-row select {
    margin: 0;
    padding: 10px;
}

.btn-remove-ingredient {
    padding: 10px 16px;
    background: #ff4444;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.product-search {
    position: relative;
}

.product-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #2a2a2a;
    border: 1px solid #ff9a3c;
    border-radius: 8px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    display: none;
}

.product-dropdown div {
    padding: 10px;
    cursor: pointer;
    color: #ffffff;
}

.product-dropdown div:hover {
    background: #3a3a3a;
}

.btn-add-ingredient {
    background: transparent;
    border: 2px dashed #444;
    color: #999;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
    width: 100%;
}

.btn-primary {
    background: linear-gradient(135deg, #ff9a3c 0%, #ff6b35 100%);
    color: #ffffff;
    border: none;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    margin-top: 30px;
}

.btn-secondary {
    background: transparent;
    border: 1px solid #444;
    color: #999;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    margin-top: 10px;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
}

.empty-state h2 {
    font-size: 24px;
    margin-bottom: 10px;
    color: #ffffff;
}

.empty-state p {
    color: #666;
}

@media (max-width: 768px) {
    .ingredient-row {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Рецепты</h1>
            <p class="subtitle">Ваша кулинарная книга</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-category="">Все</button>
            <button class="tab" data-category="торты">Торты</button>
            <button class="tab" data-category="кексы">Кексы</button>
            <button class="tab" data-category="печенье">Печенье</button>
            <button class="tab" data-category="вафли">Вафли</button>
            <button class="tab" data-category="кейкпопс">Кейк попс</button>
            <button class="tab" data-category="другое">Другое</button>
        </div>

        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск рецептов...">
        </div>

        <div id="recipesList" class="recipes-grid"></div>
    </div>

    <button class="fab" id="addBtn">+</button>

    <div id="modal" class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Новый рецепт</h2>
            <span class="close">&times;</span>
        </div>
        <div class="modal-content">
            <form id="recipeForm">
                <input type="hidden" id="recipeId">
                
                <label>Название:</label>
                <input type="text" id="recipeName" required placeholder="Например: Шоколадный торт">

                <label>Категория:</label>
                <select id="recipeCategory" required>
                    <option value="торты">Торты</option>
                    <option value="кексы">Кексы</option>
                    <option value="печенье">Печенье</option>
                    <option value="вафли">Вафли</option>
                    <option value="кейкпопс">Кейк попс</option>
                    <option value="другое">Другое</option>
                </select>

                <label>Фото:</label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                <button type="button" onclick="document.getElementById('imageUpload').click()" class="btn-add-ingredient" style="width: 100%; margin-top: 0;">+ Добавить фото</button>
                <div id="uploadStatus" style="margin-top: 10px; color: #ff9a3c; font-size: 13px;"></div>
                <input type="hidden" id="recipeImage">

                <label>Ингредиенты:</label>
                <div id="ingredientsList"></div>
                <button type="button" id="addIngredientBtn" class="btn-add-ingredient">+ Добавить ингредиент</button>

                <label>Инструкция:</label>
                <textarea id="recipeInstructions" rows="8" placeholder="Опишите процесс приготовления..."></textarea>

                <label>Время приготовления (мин):</label>
                <input type="number" id="recipeTime" placeholder="60">

                <label>Размер формы (см):</label>
                <select id="recipeFormSize">
                    <option value="">Не указан</option>
                    <option value="10">10 см (бенто)</option>
                    <option value="12">12 см (бенто)</option>
                    <option value="14">14 см (мини)</option>
                    <option value="16">16 см</option>
                    <option value="18">18 см</option>
                    <option value="20">20 см</option>
                    <option value="22">22 см</option>
                    <option value="24">24 см</option>
                    <option value="26">26 см</option>
                    <option value="28">28 см (макси)</option>
                    <option value="30">30 см (макси)</option>
                </select>

                <label>Количество (для пересчета):</label>
                <input type="number" id="recipeQuantity" placeholder="Например: 20 шт">

                <label>Выход (порций/шт):</label>
                <input type="text" id="recipeYield" placeholder="8 порций">

                <button type="submit" class="btn-primary">Сохранить рецепт</button>
                <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
            </form>
        </div>
    </div>

    <div id="viewModal" class="modal">
        <div class="modal-header">
            <h2>Рецепт</h2>
            <span class="close close-view">&times;</span>
        </div>
        <div class="modal-content">
            <div id="recipeView"></div>
            
            <div id="calculator" style="display:none; margin-top: 30px; padding: 20px; background: #2a2a2a; border-radius: 12px;">
                <h3 style="margin-bottom: 15px;">Пересчет рецепта</h3>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Тип пересчета:</label>
                    <select id="recalcType" style="width: 100%; padding: 10px; border-radius: 8px;">
                        <option value="diameter">По диаметру формы</option>
                        <option value="quantity">По количеству (шт)</option>
                    </select>
                </div>
                
                <div id="diameterRecalc">
                    <label style="display: block; margin-bottom: 5px;">Пересчитать на форму:</label>
                    <select id="targetFormSize" style="width: 100%; padding: 10px; border-radius: 8px;">
                        <option value="10">10 см (бенто)</option>
                        <option value="12">12 см (бенто)</option>
                        <option value="14">14 см (мини)</option>
                        <option value="16">16 см</option>
                        <option value="18">18 см</option>
                        <option value="20">20 см</option>
                        <option value="22">22 см</option>
                        <option value="24">24 см</option>
                        <option value="26">26 см</option>
                        <option value="28">28 см (макси)</option>
                        <option value="30">30 см (макси)</option>
                    </select>
                </div>
                
                <div id="quantityRecalc" style="display: none;">
                    <label style="display: block; margin-bottom: 5px;">Новое количество (шт):</label>
                    <input type="number" id="targetQuantity" style="width: 100%; padding: 10px; border-radius: 8px;" placeholder="Например: 30">
                </div>
                
                <button onclick="calculateRecipe()" class="btn-primary">Пересчитать</button>
                <div id="calculatedResult" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    
    <script>
// Список популярных продуктов
const products = [
    'Мука пшеничная', 'Сахар', 'Яйца', 'Масло сливочное', 'Молоко', 'Сливки 33%', 'Сливки 20%',
    'Сметана', 'Творог', 'Какао-порошок', 'Шоколад темный', 'Шоколад молочный', 'Шоколад белый',
    'Ванильный сахар', 'Ванильный экстракт', 'Разрыхлитель', 'Сода', 'Желатин', 'Агар-агар',
    'Крахмал кукурузный', 'Крахмал картофельный', 'Сгущенное молоко', 'Сливочный сыр',
    'Маскарпоне', 'Рикотта', 'Орехи грецкие', 'Орехи фундук', 'Миндаль', 'Кешью',
    'Фисташки', 'Кокосовая стружка', 'Мак', 'Изюм', 'Курага', 'Чернослив', 'Вишня',
    'Клубника', 'Малина', 'Черника', 'Смородина', 'Лимон', 'Апельсин', 'Банан',
    'Яблоко', 'Груша', 'Персик', 'Абрикос', 'Манго', 'Маракуйя', 'Мед', 'Джем',
    'Повидло', 'Карамель', 'Сироп', 'Ликер', 'Коньяк', 'Ром', 'Кофе', 'Эспрессо',
    'Соль', 'Корица', 'Кардамон', 'Имбирь', 'Мускатный орех', 'Гвоздика'
];

const units = ['гр', 'мл', 'шт', 'ст.л.', 'ч.л.', 'щепотка', 'по вкусу'];

let recipes = JSON.parse(localStorage.getItem('recipes')) || [];
let ingredients = [];
let currentCategory = '';

// Безопасная инициализация Telegram Web App
const tg = (function() {
    if (window.Telegram && window.Telegram.WebApp) {
        const app = window.Telegram.WebApp;
        try {
            app.ready();
            app.expand();
            app.setHeaderColor('#1a1a1a');
            app.setBackgroundColor('#1a1a1a');
        } catch (e) {}
        return app;
    }
    return {
        ready: () => {},
        expand: () => {},
        CloudStorage: null
    };
})();

const modal = document.getElementById('modal');
const viewModal = document.getElementById('viewModal');
const addBtn = document.getElementById('addBtn');
const closeBtn = document.querySelector('.close');
const closeViewBtn = document.querySelector('.close-view');
const cancelBtn = document.getElementById('cancelBtn');
const recipeForm = document.getElementById('recipeForm');
const recipesList = document.getElementById('recipesList');
const searchInput = document.getElementById('searchInput');
const imageUpload = document.getElementById('imageUpload');
const addIngredientBtn = document.getElementById('addIngredientBtn');
const recalcType = document.getElementById('recalcType');

// Таблица коэффициентов
const recalcTable = {
    10: { 10: 1, 12: 1.45, 14: 2, 16: 2.55, 18: 3.25, 20: 4, 22: 4.85, 24: 5.75, 26: 6.75, 28: 7.85, 30: 9 },
    12: { 10: 0.7, 12: 1, 14: 1.35, 16: 1.8, 18: 2.25, 20: 2.8, 22: 3.35, 24: 4, 26: 4.7, 28: 5.45, 30: 6.25 },
    14: { 10: 0.5, 12: 0.75, 14: 1, 16: 1.3, 18: 1.65, 20: 2, 22: 2.45, 24: 2.9, 26: 3.45, 28: 4, 30: 4.6 },
    16: { 10: 0.4, 12: 0.55, 14: 0.8, 16: 1, 18: 1.3, 20: 1.55, 22: 1.9, 24: 2.25, 26: 2.65, 28: 3.05, 30: 3.5 },
    18: { 10: 0.3, 12: 0.45, 14: 0.6, 16: 0.8, 18: 1, 20: 1.25, 22: 1.5, 24: 1.8, 26: 2.1, 28: 2.4, 30: 2.8 },
    20: { 10: 0.25, 12: 0.35, 14: 0.5, 16: 0.65, 18: 0.8, 20: 1, 22: 1.2, 24: 1.45, 26: 1.7, 28: 2, 30: 2.25 },
    22: { 10: 0.2, 12: 0.3, 14: 0.4, 16: 0.55, 18: 0.65, 20: 0.8, 22: 1, 24: 1.2, 26: 1.4, 28: 1.6, 30: 1.85 },
    24: { 10: 0.18, 12: 0.25, 14: 0.35, 16: 0.45, 18: 0.55, 20: 0.7, 22: 0.85, 24: 1, 26: 1.2, 28: 1.35, 30: 1.55 },
    26: { 10: 0.16, 12: 0.21, 14: 0.3, 16: 0.4, 18: 0.5, 20: 0.6, 22: 0.7, 24: 0.85, 26: 1, 28: 1.2, 30: 1.35 },
    28: { 10: 0.13, 12: 0.18, 14: 0.25, 16: 0.35, 18: 0.4, 20: 0.5, 22: 0.6, 24: 0.75, 26: 0.85, 28: 1, 30: 1.15 },
    30: { 10: 0.11, 12: 0.16, 14: 0.2, 16: 0.3, 18: 0.35, 20: 0.45, 22: 0.55, 24: 0.65, 26: 0.75, 28: 0.85, 30: 1 }
};

// Табы категорий
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        displayRecipes();
    };
});

recalcType.onchange = () => {
    if (recalcType.value === 'diameter') {
        document.getElementById('diameterRecalc').style.display = 'block';
        document.getElementById('quantityRecalc').style.display = 'none';
    } else {
        document.getElementById('diameterRecalc').style.display = 'none';
        document.getElementById('quantityRecalc').style.display = 'block';
    }
};

function renderIngredients() {
    const container = document.getElementById('ingredientsList');
    container.innerHTML = ingredients.map((ing, index) => `
        <div style="margin-bottom: 20px; padding: 15px; background: #2a2a2a; border-radius: 12px;">
            <div class="ingredient-row">
                <div class="product-search">
                    <input type="text" value="${ing.product}" 
                        id="product-${index}"
                        oninput="updateIngredient(${index}, 'product', this.value); searchProduct(${index}, this.value)" 
                        onfocus="showDropdown(${index})"
                        placeholder="Продукт...">
                    <div id="dropdown-${index}" class="product-dropdown"></div>
                </div>
                <input type="number" value="${ing.amount}" 
                    id="amount-${index}"
                    oninput="updateIngredient(${index}, 'amount', this.value)" 
                    placeholder="Кол-во" step="0.1">
                <select id="unit-${index}" onchange="updateIngredient(${index}, 'unit', this.value)">
                    ${units.map(u => `<option value="${u}" ${ing.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                </select>
            </div>
            <button type="button" class="btn-remove-ingredient" onclick="removeIngredient(${index})" style="width: 100%; margin-top: 10px;">Удалить</button>
        </div>
    `).join('');
}

function searchProduct(index, query) {
    const dropdown = document.getElementById(`dropdown-${index}`);
    if (!query) {
        dropdown.style.display = 'none';
        return;
    }
    
    const filtered = products.filter(p => 
        p.toLowerCase().includes(query.toLowerCase())
    );
    
    if (filtered.length > 0) {
        dropdown.innerHTML = filtered.slice(0, 10).map(p => 
            `<div onclick="selectProduct(${index}, '${p}')">${p}</div>`
        ).join('');
        dropdown.style.display = 'block';
    } else {
        dropdown.style.display = 'none';
    }
}

function showDropdown(index) {
    const dropdown = document.getElementById(`dropdown-${index}`);
    dropdown.innerHTML = products.slice(0, 10).map(p => 
        `<div onclick="selectProduct(${index}, '${p}')">${p}</div>`
    ).join('');
    dropdown.style.display = 'block';
}

function selectProduct(index, product) {
    ingredients[index].product = product;
    renderIngredients();
}

function updateIngredient(index, field, value) {
    ingredients[index][field] = value;
}

function removeIngredient(index) {
    if (confirm('Удалить этот ингредиент?')) {
        ingredients.splice(index, 1);
        renderIngredients();
    }
}

addIngredientBtn.onclick = () => {
    ingredients.push({ product: '', amount: '', unit: 'гр' });
    renderIngredients();
};

document.addEventListener('click', (e) => {
    if (!e.target.closest('.product-search')) {
        document.querySelectorAll('.product-dropdown').forEach(d => d.style.display = 'none');
    }
});

addBtn.onclick = () => {
    document.getElementById('modalTitle').textContent = 'Новый рецепт';
    recipeForm.reset();
    document.getElementById('recipeId').value = '';
    ingredients = [{ product: '', amount: '', unit: 'гр' }];
    renderIngredients();
    modal.style.display = 'block';
};

closeBtn.onclick = () => modal.style.display = 'none';
closeViewBtn.onclick = () => viewModal.style.display = 'none';
cancelBtn.onclick = () => modal.style.display = 'none';

window.onclick = (e) => {
    if (e.target === modal) modal.style.display = 'none';
    if (e.target === viewModal) viewModal.style.display = 'none';
};

imageUpload.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const statusDiv = document.getElementById('uploadStatus');
    
    if (file.size > 20 * 1024 * 1024) {
        statusDiv.textContent = '❌ Файл слишком большой (макс 20MB)';
        statusDiv.style.color = '#ff4444';
        return;
    }
    
    statusDiv.textContent = '⏳ Обработка фото...';
    statusDiv.style.color = '#ff9a3c';
    
    const reader = new FileReader();
    reader.onload = (event) => {
        document.getElementById('recipeImage').value = event.target.result;
        statusDiv.textContent = '✅ Фото добавлено!';
        statusDiv.style.color = '#4CAF50';
    };
    reader.readAsDataURL(file);
};

recipeForm.onsubmit = (e) => {
    e.preventDefault();
    
    const validIngredients = ingredients.filter(i => i.product && i.product.trim() && i.amount);
    
    if (validIngredients.length === 0) {
        alert('Добавьте хотя бы один ингредиент');
        return;
    }
    
    const id = document.getElementById('recipeId').value;
    const recipe = {
        id: id || Date.now().toString(),
        name: document.getElementById('recipeName').value,
        category: document.getElementById('recipeCategory').value,
        image: document.getElementById('recipeImage').value || 'https://via.placeholder.com/180x180?text=Фото',
        ingredients: JSON.stringify(validIngredients),
        instructions: document.getElementById('recipeInstructions').value,
        time: document.getElementById('recipeTime').value,
        formSize: document.getElementById('recipeFormSize').value,
        quantity: document.getElementById('recipeQuantity').value,
        yield: document.getElementById('recipeYield').value,
        createdAt: id ? recipes.find(r => r.id === id).createdAt : new Date().toISOString()
    };

    if (id) {
        const index = recipes.findIndex(r => r.id === id);
        recipes[index] = recipe;
    } else {
        recipes.push(recipe);
    }

    saveRecipes();
    displayRecipes();
    modal.style.display = 'none';
};

function saveRecipes() {
    localStorage.setItem('recipes', JSON.stringify(recipes));
    if (tg && tg.CloudStorage) {
        try {
            tg.CloudStorage.setItem('recipes', JSON.stringify(recipes));
        } catch (e) {}
    }
}

if (tg && tg.CloudStorage) {
    try {
        tg.CloudStorage.getItem('recipes', function(error, value) {
            if (!error && value) {
                recipes = JSON.parse(value);
                displayRecipes();
            } else {
                displayRecipes();
            }
        });
    } catch (e) {
        displayRecipes();
    }
} else {
    displayRecipes();
}

function displayRecipes() {
    const search = searchInput.value.toLowerCase();
    
    const filtered = recipes.filter(recipe => {
        const matchesCategory = !currentCategory || recipe.category === currentCategory;
        const matchesSearch = recipe.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        recipesList.innerHTML = `
            <div class="empty-state">
                <h2>Пока нет рецептов</h2>
                <p>Добавьте свой первый рецепт</p>
            </div>
        `;
        return;
    }

    recipesList.innerHTML = filtered.map(recipe => `
        <div class="recipe-card" onclick="viewRecipe('${recipe.id}')">
            <div class="recipe-image-container">
                <img src="${recipe.image}" alt="${recipe.name}" onerror="this.src='https://via.placeholder.com/180x180?text=Фото'">
            </div>
            <div class="recipe-card-content">
                <h3>${recipe.name}</h3>
                <div class="recipe-meta">
                    ${recipe.time ? `⏱ ${recipe.time} мин` : ''}
                    ${recipe.formSize ? ` • ${recipe.formSize} см` : ''}
                    ${recipe.quantity ? ` • ${recipe.quantity} шт` : ''}
                </div>
                <div class="recipe-actions" onclick="event.stopPropagation()">
                    <button class="btn-edit" onclick="editRecipe('${recipe.id}')">Изменить</button>
                    <button class="btn-delete" onclick="deleteRecipe('${recipe.id}')">Удалить</button>
                </div>
            </div>
        </div>
    `).join('');
}

let currentRecipe = null;

function viewRecipe(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    
    currentRecipe = recipe;
    const ings = JSON.parse(recipe.ingredients);

    const ingredientsList = ings.map(i => 
        `<div style="padding: 10px; background: #2a2a2a; border-radius: 8px; margin-bottom: 8px;">
            ${i.product} - ${i.amount} ${i.unit}
        </div>`
    ).join('');

    document.getElementById('recipeView').innerHTML = `
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="${recipe.image}" alt="${recipe.name}" onerror="this.src='https://via.placeholder.com/180x180?text=Фото'" style="width: 180px; height: 180px; object-fit: cover; border-radius: 50%;">
        </div>
        <h2 style="font-size: 28px; margin-bottom: 15px; text-align: center;">${recipe.name}</h2>
        <div style="text-align: center; color: #999; margin-bottom: 30px;">
            ${recipe.time ? `⏱ ${recipe.time} мин` : ''}
            ${recipe.formSize ? ` • ${recipe.formSize} см` : ''}
            ${recipe.quantity ? ` • ${recipe.quantity} шт` : ''}
        </div>
        <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 18px;">Ингредиенты:</h3>
        ${ingredientsList}
        <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 18px;">Инструкция:</h3>
        <p style="white-space: pre-wrap; line-height: 1.8; color: #ccc;">${recipe.instructions || 'Не указана'}</p>
    `;
    
    const calculator = document.getElementById('calculator');
    if (recipe.formSize || recipe.quantity) {
        calculator.style.display = 'block';
        if (recipe.formSize) {
            document.getElementById('targetFormSize').value = recipe.formSize;
        }
    } else {
        calculator.style.display = 'none';
    }
    
    viewModal.style.display = 'block';
}

function calculateRecipe() {
    if (!currentRecipe) return;
    
    const type = recalcType.value;
    let coefficient = 1;
    
    if (type === 'diameter' && currentRecipe.formSize) {
        const originalSize = parseInt(currentRecipe.formSize);
        const targetSize = parseInt(document.getElementById('targetFormSize').value);
        
        if (recalcTable[originalSize] && recalcTable[originalSize][targetSize]) {
            coefficient = recalcTable[originalSize][targetSize];
        } else {
            coefficient = Math.pow(targetSize / originalSize, 2);
        }
    } else if (type === 'quantity' && currentRecipe.quantity) {
        const originalQty = parseFloat(currentRecipe.quantity);
        const targetQty = parseFloat(document.getElementById('targetQuantity').value);
        coefficient = targetQty / originalQty;
    } else {
        alert('Не указаны данные для пересчета');
        return;
    }
    
    const ings = JSON.parse(currentRecipe.ingredients);
    const recalculated = ings.map(i => {
        const newAmount = (parseFloat(i.amount) * coefficient).toFixed(1);
        return `<div style="padding: 10px; background: #2a2a2a; border-radius: 8px; margin-bottom: 8px;">
            ${i.product} - ${newAmount} ${i.unit}
        </div>`;
    }).join('');
    
    let title = '';
    if (type === 'diameter') {
        title = `Пересчет с ${currentRecipe.formSize} см на ${document.getElementById('targetFormSize').value} см (×${coefficient.toFixed(2)})`;
    } else {
        title = `Пересчет с ${currentRecipe.quantity} шт на ${document.getElementById('targetQuantity').value} шт (×${coefficient.toFixed(2)})`;
    }
    
    document.getElementById('calculatedResult').innerHTML = `
        <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #ff9a3c;">
            <h4 style="color: #ff9a3c; margin-bottom: 10px;">${title}</h4>
            ${recalculated}
        </div>
    `;
}

function editRecipe(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    document.getElementById('modalTitle').textContent = 'Редактировать';
    document.getElementById('recipeId').value = recipe.id;
    document.getElementById('recipeName').value = recipe.name;
    document.getElementById('recipeCategory').value = recipe.category;
    document.getElementById('recipeImage').value = recipe.image;
    document.getElementById('recipeInstructions').value = recipe.instructions;
    document.getElementById('recipeTime').value = recipe.time;
    document.getElementById('recipeFormSize').value = recipe.formSize || '';
    document.getElementById('recipeQuantity').value = recipe.quantity || '';
    document.getElementById('recipeYield').value = recipe.yield;
    
    ingredients = JSON.parse(recipe.ingredients);
    renderIngredients();
    
    modal.style.display = 'block';
}

function deleteRecipe(id) {
    if (confirm('Удалить этот рецепт?')) {
        recipes = recipes.filter(r => r.id !== id);
        saveRecipes();
        displayRecipes();
    }
}

searchInput.oninput = displayRecipes;

displayRecipes();
    </script>
</body>
